<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistawings Routes Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f3fa; 
        }
        
        .header {
            background: linear-gradient(135deg, #028ee1 0%, #005fb2  100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h2 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .header .stats {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        .header .stats strong {
            font-weight: 700;
            font-size: 28px;
        }
        
        .map-container {
            padding: 20px;
        }
        
        #map-routes { 
            width: 100% !important; 
            height: 600px !important; 
            background: #f0f3fa;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .airport-label {
            background: transparent;
            border: none;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px white, -1px -1px 2px white;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="stats" id="stats">Loading...</div>
    </div>
    
    <div class="map-container">
        <div id="map-routes"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ============================================================
        // CONFIGURATION: Update these URLs to your API endpoints
        // ============================================================
        const API_AIRPORTS_URL = 'https://vistawingsva.com/db-api.php?action=airports';
        const API_ROUTES_URL = 'https://vistawingsva.com/db-api.php?action=routes&limit=1000';
        
        // ============================================================
        // Great circle interpolation
        // ============================================================
        function greatCirclePoints(lat1, lon1, lat2, lon2, n) {
            const rad = Math.PI / 180;
            const φ1 = lat1 * rad, λ1 = lon1 * rad;
            const φ2 = lat2 * rad, λ2 = lon2 * rad;

            const d = 2 * Math.asin(Math.sqrt(
                Math.pow(Math.sin((φ2 - φ1) / 2), 2) +
                Math.cos(φ1) * Math.cos(φ2) * Math.pow(Math.sin((λ2 - λ1) / 2), 2)
            ));

            if (d < 1e-10) return [[lat1, lon1]];

            const points = [];
            for (let i = 0; i <= n; i++) {
                const f = i / n;
                const A = Math.sin((1 - f) * d) / Math.sin(d);
                const B = Math.sin(f * d) / Math.sin(d);
                const x = A * Math.cos(φ1) * Math.cos(λ1) + B * Math.cos(φ2) * Math.cos(λ2);
                const y = A * Math.cos(φ1) * Math.sin(λ1) + B * Math.cos(φ2) * Math.sin(λ2);
                const z = A * Math.sin(φ1) + B * Math.sin(φ2);
                points.push([Math.atan2(z, Math.sqrt(x*x + y*y)) / rad, Math.atan2(y, x) / rad]);
            }
            return points;
        }
        
        // ============================================================
        // Load data and initialize map
        // ============================================================
        async function loadData() {
            console.log('Loading data...');
            try {
                const [airportsResponse, routesResponse] = await Promise.all([
                    fetch(API_AIRPORTS_URL),
                    fetch(API_ROUTES_URL)
                ]);
                
                console.log('Responses received');
                
                const airportsData = await airportsResponse.json();
                const routesData = await routesResponse.json();
                
                console.log('Airports:', airportsData.data?.length, 'Routes:', routesData.data?.length);
                
                const map_airports = airportsData.data || [];
                const map_routes = routesData.data || [];
                
                // Update stats
                document.getElementById('stats').innerHTML = 
                    `<strong>${map_airports.length}</strong> Airports | <strong>${map_routes.length}</strong> Routes`;
                
                console.log('Initializing map...');
                // Initialize map
                initializeMap(map_airports, map_routes);
                console.log('Map initialized');
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('stats').textContent = '(Error loading data)';
            }
        }
        
        // ============================================================
        // Initialize and render map
        // ============================================================
        function initializeMap(map_airports, map_routes) {
            const map = L.map('map-routes', {
                center: [39.5, -98.35],
                zoom: 4,
                zoomControl: true
            });
            
            L.tileLayer(
                'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                {
                    attribution: '&copy; OpenStreetMap & CARTO',
                    subdomains: 'abcd',
                    maxZoom: 19
                }
            ).addTo(map);
            
            const routeLayer = L.layerGroup().addTo(map);
            const airportLayer = L.layerGroup().addTo(map);
            const labelLayer = L.layerGroup().addTo(map);
            
            // Set pane z-indices so airports appear above routes
            map.createPane('routePane');
            map.getPane('routePane').style.zIndex = 400;
            map.createPane('airportPane');
            map.getPane('airportPane').style.zIndex = 450;
            map.createPane('labelPane');
            map.getPane('labelPane').style.zIndex = 500;

            // Airport lookup
            const airports = {};
            map_airports.forEach(ap => {
                airports[ap.ICAO_CODE] = {
                    lat: ap.LATITUDE,
                    lon: ap.LONGITUDE,
                    name: ap.FULL_NAME,
                    isBase: (ap.IS_BASE == 1 || ap.IS_BASE === true)
                };
            });

            const allRoutes = map_routes;
            const routePolylines = [];

            // Draw routes
            allRoutes.forEach(function(r) {
                const o = airports[r.ORIGIN_ICAO];
                const d = airports[r.DESTINATION_ICAO];
                if (!o || !d) { routePolylines.push(null); return; }

                const path = greatCirclePoints(o.lat, o.lon, d.lat, d.lon, 64);
                const acft = [r.ACFT_TYPE_ICAO_1, r.ACFT_TYPE_ICAO_2, r.ACFT_TYPE_ICAO_3].filter(Boolean).join(', ');
                
                const line = L.polyline(path, { 
                    weight: 1, 
                    opacity: 0.4, 
                    color: '#007bff',
                    pane: 'routePane'
                })
                .bindPopup(
                    '<strong>' + r.ORIGIN_ICAO + ' → ' + r.DESTINATION_ICAO + '</strong><br>' +
                    'Flight ' + r.FLIGHT_NUMBER +
                    (acft ? '<br>Aircraft: ' + acft : '') +
                    '<br>Status: ' + r.STATUS +
                    '<br>Season: ' + r.SEASON
                )
                .on('mouseover', function() {
                    this.setStyle({ weight: 3, opacity: 0.8 });
                })
                .on('mouseout', function() {
                    this.setStyle({ weight: 1, opacity: 0.4 });
                })
                .addTo(routeLayer);
                
                routePolylines.push(line);
            });

            // Track selected airport
            let selectedAirport = null;
            const markerRefs = {};

            // Draw airport markers
            map_airports.forEach(ap => {
                const code = ap.ICAO_CODE;
                const isBase = (ap.IS_BASE == 1 || ap.IS_BASE === true);
                
                // Count only departures (routes originating from this airport)
                const routeCount = map_routes.filter(r => 
                    r.ORIGIN_ICAO === code
                ).length;
                
                const marker = L.circleMarker(
                    [ap.LATITUDE, ap.LONGITUDE],
                    { 
                        radius: isBase ? 7 : 5, 
                        weight: 2, 
                        color: isBase ? '#155724' : '#333', 
                        fillColor: isBase ? '#28a745' : '#007bff', 
                        fillOpacity: 0.85,
                        pane: 'airportPane'
                    }
                )
                .bindPopup(
                    '<strong>' + ap.FULL_NAME + '</strong><br>' +
                    'ICAO: ' + code + '<br>' +
                    'Routes: ' + routeCount +
                    (isBase ? '<br><span style="color: #28a745;">⭐ Base Airport</span>' : '')
                )
                .on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    handleAirportClick(code);
                })
                .addTo(airportLayer);
                
                const label = L.marker(
                    [ap.LATITUDE, ap.LONGITUDE],
                    {
                        icon: L.divIcon({
                            className: 'airport-label',
                            html: code,
                            iconSize: [40, 20],
                            iconAnchor: [20, -5]
                        }),
                        interactive: false,
                        pane: 'labelPane'
                    }
                ).addTo(labelLayer);
                
                markerRefs[code] = { 
                    marker: marker, 
                    label: label, 
                    isBase: isBase 
                };
            });
            
            // Function to update airport visibility based on zoom
            function updateAirportVisibility() {
                const zoom = map.getZoom();
                
                Object.keys(markerRefs).forEach(code => {
                    const ref = markerRefs[code];
                    const markerElement = ref.marker.getElement();
                    const labelElement = ref.label.getElement();
                    
                    if (zoom <= 12) {
                        // At zoom 12 or lower, only show base airports
                        if (ref.isBase) {
                            if (markerElement) markerElement.style.display = '';
                            if (labelElement) labelElement.style.display = '';
                        } else {
                            if (markerElement) markerElement.style.display = 'none';
                            if (labelElement) labelElement.style.display = 'none';
                        }
                    } else {
                        // At zoom 13 or higher, show all airports
                        if (markerElement) markerElement.style.display = '';
                        if (labelElement) labelElement.style.display = '';
                    }
                });
            }
            
            // Set initial visibility after a short delay to ensure elements are rendered
            setTimeout(updateAirportVisibility, 100);
            
            // Update visibility on zoom change
            map.on('zoomend', updateAirportVisibility);
            
            // Helper to get airport's default style
            function getAirportStyle(code) {
                const ap = map_airports.find(a => a.ICAO_CODE === code);
                if (!ap) return { radius: 5, weight: 2, color: '#333', fillColor: '#007bff', fillOpacity: 0.85 };
                const isBase = (ap.IS_BASE == 1 || ap.IS_BASE === true);
                return {
                    radius: isBase ? 7 : 5,
                    weight: 2,
                    color: isBase ? '#155724' : '#333',
                    fillColor: isBase ? '#28a745' : '#007bff',
                    fillOpacity: 0.85
                };
            }
            
            // Click handler
            function handleAirportClick(code) {
                // Click same airport → clear selection
                if (code === selectedAirport) {
                    clearSelection();
                    return;
                }
                
                // Clear previous selection if any
                if (selectedAirport) {
                    markerRefs[selectedAirport].marker.setStyle(getAirportStyle(selectedAirport));
                }
                
                // Set new selection
                selectedAirport = code;
                markerRefs[code].marker.setStyle({ 
                    radius: 9, 
                    weight: 3, 
                    color: '#fff', 
                    fillColor: '#f0ad4e', 
                    fillOpacity: 1 
                });
                
                // Highlight routes touching this airport
                routePolylines.forEach(function(line, idx) {
                    if (!line) return;
                    const r = allRoutes[idx];
                    if (r.ORIGIN_ICAO === code) {
                        line.setStyle({ weight: 3, opacity: 0.9, color: '#f0ad4e' });
                        line.bringToFront();
                    } else {
                        line.setStyle({ weight: 1, opacity: 0.12, color: '#007bff' });
                    }
                });
            }
            
            function clearSelection() {
                if (selectedAirport) {
                    markerRefs[selectedAirport].marker.setStyle(getAirportStyle(selectedAirport));
                    selectedAirport = null;
                }
                
                // Restore all routes to default
                routePolylines.forEach(function(line) {
                    if (line) line.setStyle({ weight: 1, opacity: 0.4, color: '#007bff' });
                });
            }
            
            // Click map background to clear selection
            map.on('click', function() {
                clearSelection();
            });
        }
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
